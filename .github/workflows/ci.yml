name: CI
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test   # vitest with 100 % coverage thresholds
      - run: npm run build
      # a classic service worker cannot `import`: sw.js must not share a chunk with the page
      - run: "! grep -q 'import' dist/sw.js"
      # end-to-end: the built app in a phone-sized Chromium (routes, search, offline, navigation)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  pipeline:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]' ruff
      - run: ruff check .
      - run: python -m pytest   # enforces 100 % line+branch coverage
