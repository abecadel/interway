# United Kingdom: the River Thames (Port of London Authority below Teddington, Environment Agency above), the
# Medway, and the cruising canals and river navigations of England, Wales and Scotland (Canal & River Trust,
# Environment Agency, Broads Authority and Scottish Canals waterways). Names as mapped in OSM. Derelict or
# unrestored canals (Wilts & Berks, Thames & Severn, Grantham, Cromford, ...) are left out on purpose.
# Most English canals are narrow: locks take boats up to about 2.1 m beam and 21 m length.
