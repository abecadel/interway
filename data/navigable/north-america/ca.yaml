# Canada: the St. Lawrence and its Seaway, the Richelieu, and the lower Ottawa River. Most canals already carry
# tags the classifier takes (Trent–Severn Waterway and Trent/Otonabee rivers motorboat=designated, Welland Canal
# ship=designated, Rideau Canal and River, Chambly and Lachine canals motorboat=yes, Murray Canal); the Great
# Lakes, Georgian Bay, the North Channel and the lakes on these routes are meshed where navigable waterways meet them.
# Sources: Parks Canada historic canals (https://parks.canada.ca/lhn-nhs/on/trentsevern, /on/rideau,
# /qc/chambly, /qc/annedebellevue, /qc/carillon), St. Lawrence Seaway (https://greatlakes-seaway.com).
waterways:
  # the whole river, Lake Ontario to the Gulf (navigable for sea-going ships to Montréal)
  - Fleuve Saint-Laurent
  - Saint Lawrence River
  - Saint Lawrence River / Fleuve Saint-Laurent
  # Seaway canals: South Shore Canal (St-Lambert, Côte-Sainte-Catherine), Beauharnois, Wiley-Dondero, Iroquois
  - Voie maritime du Saint-Laurent
  - Saint Lawrence Seaway
  # Richelieu: Lake Champlain to Sorel, with the Chambly Canal and the Saint-Ours lock
  # (https://parks.canada.ca/lhn-nhs/qc/chambly/activ/navigation/circuits-itineraries)
  - Rivière Richelieu
  - Richelieu River
  # Ottawa River: Lac des Deux Montagnes (Sainte-Anne-de-Bellevue lock) to Ottawa (Carillon lock); above the
  # Chaudière Falls at Ottawa it is not one continuous navigation
  # (https://parks.canada.ca/lhn-nhs/qc/carillon/activ/navigation)
  - {name: Rivière des Outaouais, bbox: [-75.75, 45.35, -73.85, 45.65]}
  - {name: Ottawa River, bbox: [-75.75, 45.35, -73.85, 45.65]}
  - {name: Ottawa River / Rivière des Outaouais, bbox: [-75.75, 45.35, -73.85, 45.65]}
lakes:
  - Lake Ontario
  - Lac des Deux Montagnes
  - Lac Saint-Louis
  - Lac Saint-François
  - Lac Saint-Pierre
  # Great Lakes waters on the Loop and the Trent–Severn and Rideau lakes (most are reached anyway, where a
  # navigable waterway touches them; listed so a lake split into pieces in OSM is still taken whole)
  - Bay of Quinte
  - Georgian Bay
  - North Channel
  - Lake Simcoe
  - Lake Couchiching
  - Rice Lake
  - Big Rideau Lake
  - Upper Rideau Lake
  - Lower Rideau Lake
  - Lake Champlain
exclude: []
# rivers through rapids that the canals bypass; the river lines carry the waterway's name (and ship tags), so
# they are left out by way id (https://greatlakes-seaway.com/en/the-seaway/; Parks Canada Chambly Canal)
exclude_ways:
  # St. Lawrence through the Lachine Rapids (the South Shore Canal and the Lachine Canal bypass them)
  - 111625848
  - 1357654671
  - 974447518
  - 480225389
  # St. Lawrence from Lac Saint-François to Lac Saint-Louis past the Soulanges rapids and dams (Beauharnois Canal)
  - 758428438
  # Richelieu through the Saint-Jean–Chambly rapids (the Chambly Canal bypasses them)
  - 491784754
  - 770030413
  - 1258214156
