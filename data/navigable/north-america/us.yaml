# United States: the federally maintained inland waterways used by recreational boats, the New York State
# Canal System, the Intracoastal Waterways and the Okeechobee Waterway. OSM rarely tags these with ship or
# motorboat tags, so most are listed by name; rivers navigable only in part carry the box of their navigable
# reach (west, south, east, north). The open bays and sounds the ICW crosses (Chesapeake, Albemarle, Pamlico,
# Mobile Bay) are sea and reached by the sea mesh.
# Sources: USACE Navigation Data Center, "Waterways of the United States" and the lock list
# (https://www.iwr.usace.army.mil/About/Technical-Centers/WCSC-Waterborne-Commerce-Statistics-Center/);
# NY State Canal Corporation (https://www.canals.ny.gov/navinfo/); NOAA Coast Pilot 3–5 and 7
# (https://nauticalcharts.noaa.gov/publications/coast-pilot/); America's Great Loop Cruisers' Association route.
