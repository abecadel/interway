# Italy: the northern Italian waterway system (Sistema Idroviario Padano-Veneto): the Po from Cremona to the sea and its
# delta branches, the Fissero–Tartaro–Canalbianco–Po di Levante idrovia to Mantua (Mincio), the Idrovia Ferrarese
# (Po di Volano, Canale Boicelli), the Po–Brondolo idrovia to Chioggia and the Venetian lagoon, the Brenta rivers and
# canals, and the Litoranea Veneta from the lagoon to Grado and Monfalcone. Also the big lakes (Garda, Maggiore, Como),
# routable on their own. Names as mapped in OSM. Rivers that are mountain rivers for most of their length (Piave,
# Tagliamento, Brenta, Livenza, Sile) are left to their boat-tagged lower reaches.
