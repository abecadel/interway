# Reference routes the built graph must satisfy (app/src/routing/canonical.test.ts, `npm run test:routes`).
#
#   expected_km  distance from the cited source; the check passes within ± tolerance (relative); optional
#   sea          true when the route needs open-sea legs (skipped until the data includes sea routing)
#   countries    ISO codes the route needs; skipped when the data's manifest lists other countries
#   via          waterway names (substring, case-insensitive) that must appear in the route's legs
#   min_locks    lower bound for the number of locks passed
#   source       where expected_km comes from (trip reports, official guides)

