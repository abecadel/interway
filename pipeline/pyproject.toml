[project]
name = "interway-pipeline"
version = "0.1.0"
description = "Builds the Interway navigable waterway graph from OpenStreetMap data"
requires-python = ">=3.11"
dependencies = ["osmium>=4.0", "shapely>=2.0", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
interway-build = "interway_pipeline.cli:main"

[tool.setuptools]
packages = ["interway_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
