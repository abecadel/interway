[project]
name = "interway-pipeline"
version = "0.1.0"
description = "Builds the Interway navigable waterway graph from OpenStreetMap data"
requires-python = ">=3.11"
dependencies = ["osmium>=4.0", "shapely>=2.1", "numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
interway-build = "interway_pipeline.cli:main"

[tool.setuptools]
packages = ["interway_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["interway_pipeline"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
